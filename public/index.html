<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bobo</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Bobo</h1>
          <p>轻量甘特项目管理</p>
        </div>
        <div class="toolbar">
          <button id="addProjectBtn" type="button">+ 项目</button>
          <button id="addMilestoneBtn" type="button">+ 节点</button>
          <button id="saveBtn" type="button">保存</button>
          <button id="shutdownBtn" class="danger-button" type="button">&#20851;&#38381;</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="side-panel">
          <section>
            <h2>项目</h2>
            <div id="projectList" class="project-list"></div>
          </section>
          <section>
            <h2>视图</h2>
            <label class="field">
              起始日期
              <input id="viewStart" type="date">
            </label>
            <label class="field">
              结束日期
              <input id="viewEnd" type="date">
            </label>
            <button id="fitDatesBtn" type="button">适配任务范围</button>
          </section>
        </aside>

        <section class="gantt-panel" aria-label="甘特图">
          <div id="gantt" class="gantt"></div>
        </section>
      </main>
    </div>

    <div id="tooltip" class="tooltip" hidden></div>

    <dialog id="editorDialog" class="editor">
      <form method="dialog" id="editorForm">
        <div class="editor-head">
          <h2 id="editorTitle">编辑阶段</h2>
          <button class="icon-button" value="cancel" aria-label="关闭" type="submit">x</button>
        </div>
        <div class="editor-grid">
          <label class="field">标题<input id="editTitle" required></label>
          <label class="field">阶段<select id="editType"></select></label>
          <label class="field">开始<input id="editStart" type="date" required></label>
          <label class="field">结束<input id="editEnd" type="date" required></label>
          <label class="field">负责人<input id="editOwner"></label>
          <label class="field">工时<input id="editHours" type="number" min="0" step="0.5"></label>
          <label class="field">
            状态
            <select id="editStatus">
              <option>未开始</option>
              <option>进行中</option>
              <option>已完成</option>
              <option>暂停</option>
            </select>
          </label>
          <label class="check-field"><input id="editIssueOpen" type="checkbox">当前有未关闭问题</label>
          <label class="field full">当前问题<textarea id="editIssues" rows="3"></textarea></label>
          <label class="field full">备注<textarea id="editNotes" rows="3"></textarea></label>
        </div>
        <menu class="editor-actions">
          <button id="deleteStageBtn" class="danger" value="delete" type="button">删除</button>
          <span></span>
          <button value="cancel" type="submit">取消</button>
          <button id="saveStageBtn" value="default" type="button">保存</button>
        </menu>
      </form>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
